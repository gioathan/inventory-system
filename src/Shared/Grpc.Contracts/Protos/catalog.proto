syntax = "proto3";

option csharp_namespace = "InventorySystem.Grpc.Contracts.Catalog";

package catalog;

// Covers everything Scan Gateway and Dashboard call internally — reads and writes alike.
// CreateCategory/ListCategories exist here specifically so Dashboard's GraphQL mutation
// (the one deliberate exception to "GraphQL is read-only" — see architecture.md) has
// something internal to call; nothing else uses them, so REST on Catalog.Api stays as well.
service CatalogGrpcService {
  rpc GetItemByBarcode (GetItemByBarcodeRequest) returns (ItemReply);
  rpc ListItems (ListItemsRequest) returns (ListItemsReply);
  rpc CreateItem (CreateItemRequest) returns (ItemReply);
  rpc CreateCategory (CreateCategoryRequest) returns (CategoryReply);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesReply);
  rpc ApplyDiscount (ApplyDiscountRequest) returns (DiscountReply);
  rpc RemoveDiscount (RemoveDiscountRequest) returns (DiscountReply);
}

message GetItemByBarcodeRequest {
  string barcode = 1;
}

message ItemReply {
  string sku = 1;
  string name = 2;
  string barcode = 3;
  optional string category_id = 4;
  // Protobuf has no decimal type; serialized as an invariant-culture string to avoid the
  // precision loss a double would introduce for money values.
  string price = 5;
  optional string image_url = 6;
  // Fraction in (0, 1) taken off Price, e.g. 0.2 = 20% off. Unset means no active discount.
  // Price itself is never overwritten, so removing a discount is an exact, lossless revert.
  optional double discount_percentage = 7;
  // Price with discount_percentage already applied — equal to price when there's no discount.
  // Precomputed here so every reader (Scan Gateway's popup, Dashboard) shows the same number
  // without re-deriving the multiplication itself.
  string effective_price = 8;
}

message ListItemsRequest {
}

message ListItemsReply {
  repeated ItemReply items = 1;
}

message CreateItemRequest {
  string name = 1;
  string price = 2;
  // Barcode/Sku are optional: omit both and the server auto-generates a code for items with
  // no pre-existing manufacturer barcode. Supplying one is a real request for that exact
  // value — a conflict on a supplied value fails the call; a conflict on a generated one retries.
  optional string barcode = 3;
  optional string sku = 4;
  optional string category_id = 5;
  optional string image_url = 6;
}

message CreateCategoryRequest {
  string name = 1;
}

message CategoryReply {
  string id = 1;
  string name = 2;
}

message ListCategoriesRequest {
}

message ListCategoriesReply {
  repeated CategoryReply categories = 1;
}

// One percentage applied to many SKUs at once — a seasonal/low-price-period sale on a batch
// of items, not a single-item price edit.
message ApplyDiscountRequest {
  repeated string skus = 1;
  double percentage = 2; // strictly between 0 and 1; rejected otherwise
}

message RemoveDiscountRequest {
  repeated string skus = 1;
}

message DiscountReply {
  repeated ItemReply items = 1;
}
