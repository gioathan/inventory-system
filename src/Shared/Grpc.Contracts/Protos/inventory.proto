syntax = "proto3";

option csharp_namespace = "InventorySystem.Grpc.Contracts.Inventory";

package inventory;

// Covers everything Scan Gateway and Dashboard call internally — reads and, as of
// ReceiveStock, writes too. The strictly-guarded create/adjust endpoints stay REST-only
// since nothing internal calls them that way.
service InventoryGrpcService {
  rpc GetStock (GetStockRequest) returns (StockReply);
  rpc ListStock (ListStockRequest) returns (ListStockReply);
  rpc ReceiveStock (ReceiveStockRequest) returns (StockReply);
  // Scan Gateway's "sell" action: same atomic floor-at-zero guard as the REST /adjust endpoint,
  // just reachable internally now that a real caller (scan-to-sell) needs it over gRPC.
  rpc AdjustStock (AdjustStockRequest) returns (StockReply);
  // Dashboard's sessionReport query calls this, then joins the lines against Catalog's prices
  // to compute revenue — Inventory only ever reports quantities, never money.
  rpc GetSessionSummary (GetSessionSummaryRequest) returns (SessionSummaryReply);

  // Restock sessions, reachable through Scan Gateway so the frontend can run them. Opening one
  // closes whichever session was open; every receive made while a session is open is tagged
  // with it server-side, so nothing else needs to pass a session id around.
  rpc OpenRestockSession (OpenRestockSessionRequest) returns (OpenRestockSessionReply);
  rpc CloseRestockSession (RestockSessionIdRequest) returns (RestockSessionReply);
  rpc GetCurrentRestockSession (GetCurrentRestockSessionRequest) returns (CurrentRestockSessionReply);
  rpc ListRestockSessions (ListRestockSessionsRequest) returns (ListRestockSessionsReply);
  // What's moved in the open session, as unit counts per item — no revenue, so sellers can see it.
  rpc GetCurrentSessionSales (GetCurrentSessionSalesRequest) returns (CurrentSessionSalesReply);

  // Purchase order saga (Step 13) — Create/Send/Receive/Cancel each publish a command to the
  // Wolverine saga identified by purchase_order_id; the RPC returns once that command has been
  // handled and the resulting state persisted, same request/response shape as everything else
  // here even though a saga (not a one-shot handler) is doing the work underneath.
  rpc CreatePurchaseOrder (CreatePurchaseOrderRequest) returns (PurchaseOrderReply);
  rpc SendPurchaseOrder (PurchaseOrderIdRequest) returns (PurchaseOrderReply);
  rpc ReceivePurchaseOrderShipment (ReceivePurchaseOrderShipmentRequest) returns (PurchaseOrderReply);
  rpc CancelPurchaseOrder (PurchaseOrderIdRequest) returns (PurchaseOrderReply);
  rpc GetPurchaseOrder (PurchaseOrderIdRequest) returns (PurchaseOrderReply);
  rpc ListPurchaseOrders (ListPurchaseOrdersRequest) returns (ListPurchaseOrdersReply);
}

enum MovementReason {
  RESTOCK = 0;
  INTAKE = 1;
  SALE = 2;
  MANUAL_ADJUST = 3;
}

message GetStockRequest {
  string sku = 1;
}

message StockReply {
  string sku = 1;
  int32 quantity_on_hand = 2;
}

message ListStockRequest {
}

message ListStockReply {
  repeated StockReply stock = 1;
}

message ReceiveStockRequest {
  string sku = 1;
  int32 quantity = 2;
  MovementReason reason = 3;
}

message AdjustStockRequest {
  string sku = 1;
  int32 delta = 2;
  MovementReason reason = 3;
  // Sales only: price per unit actually charged (discount included), as an invariant-culture
  // decimal string like every other money value here. Stored on the ledger row so later reports
  // use what was paid, not whatever the price is by then.
  optional string unit_price = 4;
}

message GetSessionSummaryRequest {
  string session_id = 1;
}

message SessionSummaryLine {
  string sku = 1;
  int32 restocked = 2;
  int32 sold = 3;
  int32 net_delta = 4;
  int32 opening_quantity = 5; // stock when the session's period began
  int32 closing_quantity = 6; // stock when it ended (or now, while open)
  string recorded_revenue = 7; // decimal string: sum of units × price paid, for sales that carry a price
  int32 unpriced_sold = 8; // units sold before prices were recorded; the caller estimates those
}

message GetCurrentSessionSalesRequest {
}

message SessionSalesLine {
  string sku = 1;
  int32 sold = 2;
  int32 restocked = 3;
}

// Counts only, no money — readable by sellers. Session is unset when none is open.
message CurrentSessionSalesReply {
  RestockSessionReply session = 1;
  repeated SessionSalesLine lines = 2;
}

message SessionSummaryReply {
  repeated SessionSummaryLine lines = 1;
}

message RestockSessionReply {
  string id = 1;
  string opened_at = 2; // ISO 8601, same convention as PurchaseOrderReply
  optional string closed_at = 3;
  optional string note = 4;
}

message OpenRestockSessionRequest {
  optional string note = 1;
}

message OpenRestockSessionReply {
  RestockSessionReply opened = 1;
  // The session that starting this one closed, if any — lets the caller say so.
  RestockSessionReply closed = 2;
}

message RestockSessionIdRequest {
  string session_id = 1;
}

message GetCurrentRestockSessionRequest {
}

// No open session is a normal state, not an error, so it's an absent field rather than NotFound.
message CurrentRestockSessionReply {
  RestockSessionReply session = 1;
}

message ListRestockSessionsRequest {
}

message ListRestockSessionsReply {
  repeated RestockSessionReply sessions = 1;
}

enum PurchaseOrderStatus {
  DRAFT = 0;
  SENT = 1;
  PARTIALLY_RECEIVED = 2;
  RECEIVED = 3;
  CANCELLED = 4;
}

message PurchaseOrderLineInput {
  string sku = 1;
  int32 quantity = 2;
}

message CreatePurchaseOrderRequest {
  string supplier_name = 1;
  repeated PurchaseOrderLineInput lines = 2;
}

message PurchaseOrderIdRequest {
  string purchase_order_id = 1;
}

message ReceivePurchaseOrderShipmentRequest {
  string purchase_order_id = 1;
  repeated PurchaseOrderLineInput lines = 2;
}

message ListPurchaseOrdersRequest {
}

message PurchaseOrderLineReply {
  string sku = 1;
  int32 ordered_quantity = 2;
  int32 received_quantity = 3;
}

message PurchaseOrderReply {
  string id = 1;
  string supplier_name = 2;
  PurchaseOrderStatus status = 3;
  repeated PurchaseOrderLineReply lines = 4;
  string opened_at = 5;
  optional string closed_at = 6;
}

message ListPurchaseOrdersReply {
  repeated PurchaseOrderReply purchase_orders = 1;
}
