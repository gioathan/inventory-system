apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-api
  namespace: inventory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staff-api
  template:
    metadata:
      labels:
        app: staff-api
    spec:
      containers:
        - name: staff-api
          image: staff-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development # enables /health, the startup EF migration, and the seeded dev admin (see Program.cs)
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__staffdb
              valueFrom:
                secretKeyRef:
                  name: staff-api-secrets
                  key: ConnectionStrings__staffdb
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: Jwt__SigningKey
            # Traces/metrics ship here via OTLP/gRPC — see k8s/jaeger.yaml.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
            # See catalog-api.yaml for why this is needed — Aspire sets it automatically locally.
            - name: OTEL_SERVICE_NAME
              value: staff-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: staff-api
  namespace: inventory-system
spec:
  selector:
    app: staff-api
  ports:
    - name: http
      port: 80
      targetPort: http
