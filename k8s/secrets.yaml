# Local dev only — never commit real secrets. Same convention as AppHost.cs's pinned
# "local-dev-only-password"/"local-dev-only-signing-key" parameters: stable literals so nothing
# breaks across every re-apply, instead of values that'd need regenerating and re-wiring by hand.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: inventory-system
type: Opaque
stringData:
  # Same literal reused by all three Postgres instances (catalog/inventory/staff) — each has its
  # own isolated volume, so sharing the password isn't sharing access to anything.
  POSTGRES_PASSWORD: local-dev-only-password
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: inventory-system
type: Opaque
stringData:
  RABBITMQ_DEFAULT_PASS: local-dev-only-rabbitmq-password
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: inventory-system
type: Opaque
stringData:
  # Shared by every service: Staff.Api signs with it, everyone else only validates — same
  # requirement as AppHost.cs's single jwt-signing-key parameter.
  Jwt__SigningKey: "local-dev-only-signing-key-do-not-use-in-prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: inventory-system
type: Opaque
stringData:
  # Matches the env var shape Aspire already injects (double-underscore = config section
  # separator), so Catalog.Api's Program.cs needs zero changes to run here.
  ConnectionStrings__catalogdb: "Host=postgres-catalog.inventory-system.svc.cluster.local;Port=5432;Database=catalogdb;Username=postgres;Password=local-dev-only-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-api-secrets
  namespace: inventory-system
type: Opaque
stringData:
  ConnectionStrings__inventorydb: "Host=postgres-inventory.inventory-system.svc.cluster.local;Port=5432;Database=inventorydb;Username=postgres;Password=local-dev-only-password"
  ConnectionStrings__rabbitmq: "amqp://guest:local-dev-only-rabbitmq-password@rabbitmq.inventory-system.svc.cluster.local:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-api-secrets
  namespace: inventory-system
type: Opaque
stringData:
  ConnectionStrings__notificationdb: "mongodb://mongo.inventory-system.svc.cluster.local:27017"
  ConnectionStrings__rabbitmq: "amqp://guest:local-dev-only-rabbitmq-password@rabbitmq.inventory-system.svc.cluster.local:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: staff-api-secrets
  namespace: inventory-system
type: Opaque
stringData:
  ConnectionStrings__staffdb: "Host=postgres-staff.inventory-system.svc.cluster.local;Port=5432;Database=staffdb;Username=postgres;Password=local-dev-only-password"
