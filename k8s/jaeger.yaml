# Step 12: distributed tracing. Jaeger's "all-in-one" image bundles the OTLP receiver, the
# storage (in-memory — traces are lost on restart, fine for local dev/learning), and the query
# UI in one container — the lightweight option for a single-node cluster that's already running
# 13 other workloads. A real deployment would split these and use persistent storage (Cassandra/
# Elasticsearch) instead.
#
# Metrics are deliberately NOT duplicated here: linkerd-viz already runs a Prometheus scraping
# every meshed pod for RPS/latency/success-rate (see docs/architecture.md's Service Mesh
# section) — that already covers Step 12's metrics goal at the request level. A second, separate
# app-level Prometheus is worth adding only once there are custom business metrics to scrape
# that Linkerd's own request-level view can't answer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: inventory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: inventory-system
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
