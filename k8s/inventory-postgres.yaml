apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-inventory-data
  namespace: inventory-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-inventory
  namespace: inventory-system
spec:
  replicas: 1 # see catalog-postgres.yaml for why this is a Deployment, not a StatefulSet
  selector:
    matchLabels:
      app: postgres-inventory
  template:
    metadata:
      labels:
        app: postgres-inventory
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inventorydb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql # postgres:18+ layout — see catalog-postgres.yaml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-inventory-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory
  namespace: inventory-system
spec:
  selector:
    app: postgres-inventory
  ports:
    - port: 5432
      targetPort: 5432
