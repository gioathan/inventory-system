# Backs scan-gateway's barcode->item cache only (see architecture.md — never on the live-stock
# read path). No auth, no PVC: a cache is fine to lose on restart, same as Aspire's local Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: inventory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.6
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: inventory-system
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
