# "v1" here is the baseline/stable version. See catalog-api-canary.yaml for v2 and the
# GRPCRoute that splits traffic between them — this file alone is a normal single-version
# deployment; the canary pieces are additive and can be removed without touching this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api-v1
  namespace: inventory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
      version: v1
  template:
    metadata:
      labels:
        app: catalog-api
        version: v1
    spec:
      containers:
        - name: catalog-api
          image: catalog-api:dev
          # Built locally via `dotnet publish -t:PublishContainer` and loaded with
          # `k3d image import` (see k8s/README.md) — never try to pull this from a registry.
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development # dev-only gate: enables /health, /alive, and the startup EF migration (see Program.cs)
            # The base mcr.microsoft.com/dotnet/aspnet image bakes in ASPNETCORE_HTTP_PORTS=8080,
            # which would bind its own default endpoint on the same port as "Grpc" below and
            # crash on startup ("address already in use") — cleared so only the two explicit
            # named endpoints below exist.
            - name: ASPNETCORE_HTTP_PORTS
              value: ""
            # Two separate Kestrel endpoints, not one: without TLS there's no ALPN, so a single
            # endpoint can't negotiate HTTP/1.1 vs HTTP/2 per-connection — it just falls back to
            # HTTP/1.1 only (Kestrel logs a warning saying exactly this). gRPC hard-requires
            # HTTP/2, so the grpc endpoint is pinned to Http2-only (cleartext "h2c", the standard
            # pattern for internal cluster traffic with TLS terminated elsewhere); the probes
            # then need their own plain HTTP/1.1 endpoint since kubelet's probe client doesn't
            # speak HTTP/2 prior-knowledge.
            - name: Kestrel__Endpoints__Grpc__Url
              value: "http://+:8080"
            - name: Kestrel__Endpoints__Grpc__Protocols
              value: Http2
            - name: Kestrel__Endpoints__Http__Url
              value: "http://+:8081"
            - name: Kestrel__Endpoints__Http__Protocols
              value: Http1
            - name: ConnectionStrings__catalogdb
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secrets
                  key: ConnectionStrings__catalogdb
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: Jwt__SigningKey
            # Traces/metrics ship here via OTLP/gRPC — see k8s/jaeger.yaml. Same config key
            # AddOpenTelemetryExporters() already checks for in ServiceDefaults/Extensions.cs;
            # Aspire sets this automatically for local dev, this is the k8s equivalent.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
            # Without this, every service's traces show up in Jaeger as the same generic
            # "unknown_service:dotnet" — Aspire sets this automatically per-resource locally;
            # nothing does in plain k8s, so it has to be explicit here.
            - name: OTEL_SERVICE_NAME
              value: catalog-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api-v1
  namespace: inventory-system
spec:
  selector:
    app: catalog-api
    version: v1
  ports:
    - name: grpc
      port: 80
      targetPort: grpc
---
# The apex Service — this is the DNS name callers (scan-gateway, dashboard-api) actually dial.
# Deliberately has NO selector of its own: with the canary GRPCRoute applied, Linkerd's
# destination controller answers "where does traffic for catalog-api go" using the GRPCRoute's
# weighted backendRefs instead of this Service's own endpoint list, so giving it real endpoints
# here would just be a second, conflicting source of truth. Without catalog-api-canary.yaml
# applied, this Service has zero endpoints and nothing works — apply that file too, even at
# 100/0, to get a normal single-version deployment routed through it.
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: inventory-system
spec:
  selector:
    app: catalog-api
    version: does-not-exist
  ports:
    - name: grpc
      port: 80
      targetPort: grpc
